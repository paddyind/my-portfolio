services:
  portfolio-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.local,portfolio-server,ollama}
    container_name: portfolio-frontend
    ports:
      - "${PORTFOLIO_HOST_FRONTEND_PORT:-3400}:8080"
    environment:
      - NODE_ENV=production
    networks:
      - portfolio-network
    depends_on:
      portfolio-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  portfolio-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.local,ollama}
    container_name: portfolio-server
    ports:
      - "${PORTFOLIO_HOST_SERVER_PORT:-3401}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_MODEL=${LLM_MODEL:-gemma2:2b}
      # With --profile llm: Ollama runs in compose → use service name.
      # Without profile: point at host Ollama (Docker Desktop) on port 3420 or 11434.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    volumes:
      - portfolio-data:/app/data
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Private local LLM — start with: docker compose --profile llm up -d
  ollama:
    image: ollama/ollama:latest
    container_name: portfolio-ollama
    ports:
      - "${PORTFOLIO_HOST_OLLAMA_PORT:-3420}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - portfolio-network
    profiles:
      - llm
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

networks:
  portfolio-network:
    driver: bridge

volumes:
  portfolio-data:
    driver: local
  ollama-data:
    driver: local
